services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    restart: "no"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command: [ "alembic", "upgrade", "head" ]
    depends_on:
      db:
        condition: service_healthy

  reference:
    build: .
    restart: "no"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command: [ "strandarr", "reference" ]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command: [ "uvicorn", "strandarr.web.api:app", "--host", "0.0.0.0", "--port", "8000" ]
    ports:
      - "127.0.0.1:${WEB_PORT}:8000"
    depends_on:
      reference:
        condition: service_completed_successfully

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command: [ "strandarr", "worker" ]
    depends_on:
      reference:
        condition: service_completed_successfully

  aisstream:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command: [ "strandarr", "aisstream" ]
    depends_on:
      reference:
        condition: service_completed_successfully

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"
    depends_on:
      - db

volumes:
  db_data:
  pgadmin_data:
