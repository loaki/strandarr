[project]
name = "strandarr"
version = "0.1.0"
description = "Cetacean strandings alongside vessel traffic and sea state"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.51,<3.0.0",
    "psycopg[binary]>=3.2.9,<4.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
    "fastapi>=0.139.0,<0.140.0",
    "uvicorn>=0.35.0,<0.36.0",
    "alembic>=1.16.4,<2.0.0",
    "websockets>=14.0,<16.0",
]

[project.scripts]
strandarr = "strandarr.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.15.21,<0.16.0",
    "mypy>=1.14,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
